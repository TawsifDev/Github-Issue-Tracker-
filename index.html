<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind css & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Github Issue Tracker </title>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <!-- Navbar -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-md px-8 py-10">
        <div class="flex justify-center mb-4">
            <img src="./assets/github-logo.png" alt="Logo" class="w-16 h-16 rounded-full object-cover" />
        </div>


        <h1 class="text-center text-2xl font-bold text-slate-900">
            Github Issues Tracker
        </h1>

        <p class="text-center text-sm text-slate-500 mt-1">
            Sign in to manage your issues
        </p>

        <form id="loginForm" class="mt-8 space-y-4">
            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Username
                </label>
                <input id="username" type="text" placeholder="Enter Username" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                 placeholder-slate-400 focus:outline-none focus:ring-2
                 focus:ring-indigo-500 focus:border-indigo-500 transition" />
                <p class="text-xs text-indigo-600 mt-1">
                    Default: <span class="font-medium">admin</span>
                </p>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Password
                </label>
                <input id="password" type="password" placeholder="Enter Password" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                 placeholder-slate-400 focus:outline-none focus:ring-2
                 focus:ring-indigo-500 focus:border-indigo-500 transition" />
                <p class="text-xs text-indigo-600 mt-1">
                    Default: <span class="font-medium">admin123</span>
                </p>
            </div>

            <!-- Sign In Button -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
               text-white font-semibold py-3 rounded-lg transition
               focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Sign In
            </button>
        </form>


        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-slate-200"></div>
            <span class="text-xs text-slate-400 font-medium">OR</span>
            <div class="flex-1 h-px bg-slate-200"></div>
        </div>


        <div class="bg-slate-100 rounded-lg px-4 py-4 text-center">
            <p class="text-xs text-slate-500 mb-2">Demo Credentials:</p>
            <p class="text-sm text-slate-800 font-semibold">Username: admin</p>
            <p class="text-sm text-slate-800 font-semibold">Password: admin123</p>
        </div>


        <p id="errorMsg" class="text-center text-sm text-red-500 mt-3 hidden">
            Invalid credentials. Please try again.
        </p>

    </div>


    <!-- JavaScript -->
    <script src="login.js"></script>
</body>

</html>
